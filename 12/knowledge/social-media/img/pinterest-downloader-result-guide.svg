<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">شرح نتيجة أداة تحميل فيديو Pinterest</title><desc id="desc">لقطة فعلية لبطاقة النتيجة مع توضيح المعاينة والجودة والتنزيل المباشر وفتح الفيديو</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f7ff"/><stop offset="1" stop-color="#effbf7"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#312a63" flood-opacity=".15"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6558e8"/></marker></defs>
  <rect width="1200" height="900" rx="38" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="25" font-weight="900" fill="#292442">اقرأ بطاقة النتيجة قبل اختيار مسار الحفظ</text>
  <g filter="url(#sh)"><rect x="137" y="105" width="926" height="660" rx="28" fill="#fff" stroke="#dcd8ee"/><image href="pinterest-downloader-result.png" x="160" y="128" width="880" height="626" preserveAspectRatio="xMidYMid meet"/></g>
  <g><circle cx="1010" cy="235" r="21" fill="#e60023"/><text x="1010" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#fff">1</text><path d="M985 235H850" fill="none" stroke="#e60023" stroke-width="4" marker-end="url(#a)"/></g>
  <g><circle cx="188" cy="342" r="21" fill="#6558e8"/><text x="188" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#fff">2</text><path d="M214 342h130" fill="none" stroke="#6558e8" stroke-width="4" marker-end="url(#a)"/></g>
  <g><circle cx="188" cy="520" r="21" fill="#13a87a"/><text x="188" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#fff">3</text><path d="M214 520h142" fill="none" stroke="#13a87a" stroke-width="4" marker-end="url(#a)"/></g>
  <g transform="translate(66 804)"><rect width="1068" height="62" rx="20" fill="#fff" stroke="#ddd8f2"/><g font-family="Cairo,Tahoma,Arial,sans-serif" font-size="13" font-weight="800" fill="#4d4662" direction="rtl"><text x="895" y="38" text-anchor="middle"><tspan fill="#e60023">1</tspan> عاين التشغيل والصورة</text><text x="535" y="38" text-anchor="middle"><tspan fill="#6558e8">2</tspan> اختر جودة تناسب جهازك</text><text x="176" y="38" text-anchor="middle"><tspan fill="#13a87a">3</tspan> افتح الفيديو عند تعذر الحفظ</text></g></g>
</svg>
