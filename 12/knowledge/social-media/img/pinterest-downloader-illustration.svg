<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">دليل فهم روابط فيديو Pinterest وجودة الحفظ</title>
  <desc id="desc">رسم يوضح انتقال رابط Pin عام إلى تحليل الوسائط ثم فحص MP4 والجودة قبل الحفظ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1efff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6558e8"/><stop offset="1" stop-color="#4b3fc6"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e60023"/><stop offset="1" stop-color="#bd001c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#322b68" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6558e8"/></marker>
  </defs>
  <rect width="760" height="520" rx="38" fill="url(#bg)"/>
  <circle cx="82" cy="74" r="82" fill="#e60023" opacity=".06"/><circle cx="706" cy="454" r="112" fill="#6558e8" opacity=".08"/>
  <g transform="translate(310 30)"><rect width="140" height="46" rx="23" fill="#fff" stroke="#dedaf4"/><circle cx="112" cy="23" r="16" fill="url(#pin)"/><text x="112" y="29" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#fff">P</text><text x="54" y="29" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="14" font-weight="900" fill="#332e51">رحلة الرابط</text></g>
  <g transform="translate(44 128)" filter="url(#shadow)"><rect width="204" height="250" rx="28" fill="#fff" stroke="#dfdbee"/><circle cx="102" cy="54" r="31" fill="#fff1f3"/><path d="M91 55a12 12 0 0 1 21-8l5 5a12 12 0 0 1-8 21M113 51a12 12 0 0 1-21 8l-5-5a12 12 0 0 1 8-21" fill="none" stroke="#d50020" stroke-width="4" stroke-linecap="round"/><text x="102" y="113" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="18" font-weight="900" fill="#2f2a49">رابط Pin عام</text><text x="102" y="145" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#716b83">تحقق من النطاق والخصوصية</text><rect x="25" y="174" width="154" height="38" rx="12" fill="#faf9ff" stroke="#e4e0f2"/><text x="102" y="198" text-anchor="middle" direction="ltr" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#59536c">pinterest.com/pin/…</text></g>
  <path d="M263 250H322" fill="none" stroke="#6558e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(326 128)" filter="url(#shadow)"><rect width="154" height="250" rx="28" fill="url(#brand)"/><circle cx="77" cy="60" r="31" fill="#fff" opacity=".15"/><path d="M55 64h44M64 51l-13 13 13 13M90 51l13 13-13 13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="125" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="18" font-weight="900" fill="#fff">تحليل الوسائط</text><text x="77" y="157" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e4ff">استخراج روابط الفيديو</text><rect x="24" y="183" width="106" height="36" rx="18" fill="#fff" opacity=".14"/><text x="77" y="206" text-anchor="middle" direction="ltr" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="900" fill="#fff">MP4 · HD</text></g>
  <path d="M494 250H550" fill="none" stroke="#6558e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(554 128)" filter="url(#shadow)"><rect width="162" height="250" rx="28" fill="#fff" stroke="#dfdbee"/><circle cx="81" cy="57" r="32" fill="#e8fbf5"/><path d="m65 57 11 11 22-24" fill="none" stroke="#12a676" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="81" y="117" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="18" font-weight="900" fill="#2f2a49">تحقق قبل الحفظ</text><g font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="800" fill="#5f596f" direction="rtl"><text x="81" y="153" text-anchor="middle">نوع الملف</text><text x="81" y="181" text-anchor="middle">الحجم الحقيقي</text><text x="81" y="209" text-anchor="middle">قابلية التشغيل</text></g></g>
  <g transform="translate(148 420)"><rect width="464" height="54" rx="27" fill="#fff" stroke="#ddd8f3"/><circle cx="428" cy="27" r="15" fill="#6558e8"/><path d="M421 27h14M430 20l7 7-7 7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="34" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="14" font-weight="900" fill="#4d4566">النتيجة التقنية لا تمنح حق إعادة النشر</text></g>
</svg>
