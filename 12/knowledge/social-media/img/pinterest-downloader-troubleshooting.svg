<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">مسار تشخيص مشكلات تنزيل فيديو Pinterest</title><desc id="desc">مخطط يفصل بين خطأ الرابط وخصوصية المنشور واستجابة التنزيل وتوافق تشغيل MP4</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf9ff"/><stop offset="1" stop-color="#edf9f5"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#77708e"/></marker><filter id="sh" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#342d66" flood-opacity=".1"/></filter></defs>
  <rect width="960" height="420" rx="34" fill="url(#bg)"/><text x="480" y="48" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="23" font-weight="900" fill="#2d2846">شخّص طبقة واحدة في كل مرة</text>
  <path d="M196 208h68M438 208h68M680 208h68" fill="none" stroke="#77708e" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#a)"/>
  <g transform="translate(32 100)" filter="url(#sh)"><rect width="164" height="216" rx="24" fill="#fff" stroke="#ddd9ee"/><circle cx="82" cy="54" r="28" fill="#fff0f3"/><text x="82" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#d20020">1</text><text x="82" y="112" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="16" font-weight="900" fill="#352f4d">صلاحية الرابط</text><text x="82" y="147" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">Pinterest أو pin.it</text><text x="82" y="174" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">من دون مسافات زائدة</text></g>
  <g transform="translate(274 100)" filter="url(#sh)"><rect width="164" height="216" rx="24" fill="#fff" stroke="#ddd9ee"/><circle cx="82" cy="54" r="28" fill="#fff7e9"/><text x="82" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#b7720f">2</text><text x="82" y="112" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="16" font-weight="900" fill="#352f4d">إتاحة الـPin</text><text x="82" y="147" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">عام وليس خاصًا</text><text x="82" y="174" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">ويحتوي فيديو فعليًا</text></g>
  <g transform="translate(516 100)" filter="url(#sh)"><rect width="164" height="216" rx="24" fill="#fff" stroke="#ddd9ee"/><circle cx="82" cy="54" r="28" fill="#efedff"/><text x="82" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#5b4fd4">3</text><text x="82" y="112" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="16" font-weight="900" fill="#352f4d">استجابة الملف</text><text x="82" y="147" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">Content-Type: video/mp4</text><text x="82" y="174" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">والحجم أكبر من صفر</text></g>
  <g transform="translate(758 100)" filter="url(#sh)"><rect width="164" height="216" rx="24" fill="#fff" stroke="#ddd9ee"/><circle cx="82" cy="54" r="28" fill="#e8faf4"/><text x="82" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#0e986d">4</text><text x="82" y="112" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="16" font-weight="900" fill="#352f4d">التشغيل الفعلي</text><text x="82" y="147" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">اختبر MP4 المتوافق</text><text x="82" y="174" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6c667a">على جهاز أو متصفح ثانٍ</text></g>
  <rect x="270" y="350" width="420" height="42" rx="21" fill="#fff" stroke="#ddd8f2"/><text x="480" y="377" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="13" font-weight="900" fill="#514a65">لا تكرر النقر؛ سجّل الرسالة ثم اختبر العامل التالي</text>
</svg>
