<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">مقارنة خيارات فيديو Pinterest</title><desc id="desc">مقارنة بين MP4 المتوافق وأعلى جودة وفتح الفيديو وغلاف الفيديو</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf9ff"/><stop offset="1" stop-color="#eff9f6"/></linearGradient><filter id="sh" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#362f69" flood-opacity=".11"/></filter></defs>
  <rect width="960" height="420" rx="34" fill="url(#bg)"/><text x="480" y="47" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="23" font-weight="900" fill="#2c2745">أي خيار يخدم مهمتك؟</text>
  <g transform="translate(38 82)" filter="url(#sh)"><rect width="205" height="280" rx="24" fill="#fff" stroke="#ddd9ee"/><rect width="205" height="12" rx="6" fill="#13a87a"/><circle cx="102" cy="67" r="31" fill="#e7faf4"/><path d="m87 67 10 10 21-22" fill="none" stroke="#13a87a" stroke-width="4" stroke-linecap="round"/><text x="102" y="122" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="17" font-weight="900" fill="#332e4b">MP4 المتوافق</text><text x="102" y="159" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">الأفضل لمعظم الأجهزة</text><text x="102" y="194" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">اختبر الصوت والتشغيل</text><rect x="32" y="226" width="141" height="34" rx="17" fill="#e7faf4"/><text x="102" y="248" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11" font-weight="900" fill="#0b815d">الخيار الآمن أولًا</text></g>
  <g transform="translate(264 82)" filter="url(#sh)"><rect width="205" height="280" rx="24" fill="#fff" stroke="#ddd9ee"/><rect width="205" height="12" rx="6" fill="#6558e8"/><circle cx="102" cy="67" r="31" fill="#efedff"/><path d="M84 78V56h36v22M91 56v-9h22v9" fill="none" stroke="#6558e8" stroke-width="3.5" stroke-linejoin="round"/><text x="102" y="122" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="17" font-weight="900" fill="#332e4b">أعلى جودة</text><text x="102" y="159" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">تفاصيل أكثر وحجم أكبر</text><text x="102" y="194" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">قد تتطلب دعم HEVC</text><rect x="32" y="226" width="141" height="34" rx="17" fill="#efedff"/><text x="102" y="248" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11" font-weight="900" fill="#5548cb">للأرشفة والتحرير</text></g>
  <g transform="translate(490 82)" filter="url(#sh)"><rect width="205" height="280" rx="24" fill="#fff" stroke="#ddd9ee"/><rect width="205" height="12" rx="6" fill="#e60023"/><circle cx="102" cy="67" r="31" fill="#fff0f3"/><path d="m93 51 24 16-24 16Z" fill="#e60023"/><text x="102" y="122" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="17" font-weight="900" fill="#332e4b">فتح الفيديو</text><text x="102" y="159" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">عرض الرابط في تبويب جديد</text><text x="102" y="194" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">مفيد عند منع التنزيل</text><rect x="32" y="226" width="141" height="34" rx="17" fill="#fff0f3"/><text x="102" y="248" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11" font-weight="900" fill="#bf001d">للمعاينة والحفظ اليدوي</text></g>
  <g transform="translate(716 82)" filter="url(#sh)"><rect width="205" height="280" rx="24" fill="#fff" stroke="#ddd9ee"/><rect width="205" height="12" rx="6" fill="#d58a16"/><circle cx="102" cy="67" r="31" fill="#fff7e9"/><rect x="84" y="50" width="36" height="31" rx="5" fill="none" stroke="#c77b0f" stroke-width="3"/><circle cx="94" cy="60" r="4" fill="#c77b0f"/><path d="m87 77 10-10 7 7 6-6 8 9" fill="none" stroke="#c77b0f" stroke-width="3"/><text x="102" y="122" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="17" font-weight="900" fill="#332e4b">غلاف الفيديو</text><text x="102" y="159" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">صورة ثابتة وليست MP4</text><text x="102" y="194" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#6b6578">لا تعوّض ملف الفيديو</text><rect x="32" y="226" width="141" height="34" rx="17" fill="#fff7e9"/><text x="102" y="248" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="11" font-weight="900" fill="#9b610d">للفهرسة والمعاينة</text></g>
