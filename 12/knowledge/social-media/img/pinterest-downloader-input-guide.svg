<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">شرح إدخال رابط Pinterest في الأداة</title><desc id="desc">لقطة فعلية لواجهة ToolRar مع توضيح موضع رابط Pin وزر بدء التحليل</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f7ff"/><stop offset="1" stop-color="#eef8f6"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#342e69" flood-opacity=".14"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6558e8"/></marker></defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="25" font-weight="900" fill="#292442">المرحلة الأولى: ثبّت رابط الـPin قبل التحليل</text>
  <g filter="url(#sh)"><rect x="78" y="118" width="1044" height="445" rx="28" fill="#fff" stroke="#ddd9ef"/><image href="pinterest-downloader-input.png" x="98" y="138" width="1004" height="428" preserveAspectRatio="xMidYMid meet"/></g>
  <g><circle cx="1000" cy="395" r="22" fill="#6558e8"/><text x="1000" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#fff">1</text><path d="M974 395H825" fill="none" stroke="#6558e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/></g>
  <g><circle cx="184" cy="395" r="22" fill="#e60023"/><text x="184" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#fff">2</text><path d="M210 395h104" fill="none" stroke="#e60023" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/></g>
  <g transform="translate(90 602)"><rect width="485" height="60" rx="18" fill="#fff" stroke="#ddd8f2"/><circle cx="448" cy="30" r="16" fill="#6558e8"/><text x="448" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="#fff">1</text><text x="224" y="37" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="14" font-weight="800" fill="#4d4662">ألصق رابط Pin عام كاملًا، لا رابط صورة منفردة</text></g>
  <g transform="translate(625 602)"><rect width="485" height="60" rx="18" fill="#fff" stroke="#ddd8f2"/><circle cx="448" cy="30" r="16" fill="#e60023"/><text x="448" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="#fff">2</text><text x="224" y="37" text-anchor="middle" direction="rtl" font-family="Cairo,Tahoma,Arial,sans-serif" font-size="14" font-weight="800" fill="#4d4662">ابدأ التحليل مرة واحدة وانتظر رسالة النتيجة</text></g>
</svg>
